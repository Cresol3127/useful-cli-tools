name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python3 -B -m unittest discover -s appimage-update -v
      - name: Shell syntax
        run: bash -n audiofetch/audiofetch
